; Beveiligingsinstellingen voor PHP.
;
; De container laadde helemaal geen php.ini, dus alles stond op de standaard
; ingebouwde waarden. Dit bestand wordt geladen doordat PHP_INI_SCAN_DIR in
; variables.env op ":/setup/php-ini" staat. De dubbele punt vooraan betekent
; "eerst de standaardmap, daarna deze map" -- die standaardmap bevat de
; configuratie van de sqlsrv-databasedriver, dus die mag niet verdwijnen.

; ---------------------------------------------------------------------------
; Foutmeldingen niet aan de bezoeker tonen
; ---------------------------------------------------------------------------
; PHP-foutmeldingen bevatten het absolute pad op de server en vaak de namen
; van interne functies. Dat is verkenningsmateriaal voor een aanvaller.
display_errors = Off
display_startup_errors = Off

; Wel blijven registreren, anders kan er niet meer ontwikkeld worden.
; /dev/stderr komt terecht in "docker compose logs web_server".
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; De exacte PHP-versie stond in de header van elke response (X-Powered-By).
expose_php = Off

; ---------------------------------------------------------------------------
; Sessies
; ---------------------------------------------------------------------------
; Zonder deze instelling accepteert PHP een zelfverzonnen sessie-ID uit een
; cookie en hangt daar een echte sessie aan. Met strict mode weigert PHP een
; ID dat het zelf nooit heeft uitgegeven, en deelt het een nieuw ID uit.
; Dit is de tweede helft van de maatregel tegen session fixation; de eerste
; helft is session_regenerate_id() bij inloggen, registreren en uitloggen.
session.use_strict_mode = 1

; Deze twee staan ook in startSessie() in logica/sessie.php. Bewust dubbel:
; de applicatie moet veilig zijn ook als deze configuratie niet geladen wordt.
session.cookie_httponly = 1
session.cookie_samesite = Lax
